[package]
name = "ferropress-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferropress composition root: the only place adapters are selected and wired into ports, then boots HTTP + serve loop + plugin host."

[lints]
workspace = true

[[bin]]
name = "ferropress-server"
path = "src/main.rs"

[dependencies]
# Ports + the owned subsystems.
ferropress-core = { workspace = true }
ferropress-auth = { workspace = true }
ferropress-store-embedded = { workspace = true }
ferropress-serve = { workspace = true }
ferropress-http = { workspace = true }
ferropress-plugin-host = { workspace = true }

# The concrete adapters this root selects (the ONLY crate that names all four).
ferropress-secrets-env = { workspace = true }
ferropress-blob-localfs = { workspace = true }
ferropress-sched-tokiocron = { workspace = true }
ferropress-cert-acme = { workspace = true }

tokio = { workspace = true }
anyhow = { workspace = true }
# `tracing` for the spawned regen-loop task's structured logs; `-subscriber`
# installs the global collector at boot.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The full-stack feed-loop e2e drives a REAL EmbeddedStore + PluginHost + HookBridge
# with the real backlink-index wasm (wasm-gated; skips if not built). It reaches the
# subsystems this crate already depends on — no new production edge.
tempfile = { workspace = true }
serde_json = { workspace = true }
