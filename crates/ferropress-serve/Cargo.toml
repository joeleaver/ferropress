[package]
name = "ferropress-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Static-first hybrid orchestration: prerender cache + an incremental regen loop driven by RhypeStore::subscribe (regenerate only affected pages). Stub scaffold."

[lints]
workspace = true

[dependencies]
ferropress-core = { workspace = true }
# Render/theme are the page-production collaborators the regen loop calls into.
# Wired as edges now (the manifest's intended graph); used once regen_loop /
# render_page get real bodies.
ferropress-render = { workspace = true }
ferropress-theme = { workspace = true }
# The typed SiteSettings projection + the settings schema (defaults overlay).
ferropress-render-form = { workspace = true }
# The change stream is awaited via tokio-stream's StreamExt; tokio drives the loop.
tokio = { workspace = true }
tokio-stream = { workspace = true }
# Public-theme date formatting (site.date_format / site.timezone): stored dates
# are epoch millis, formatted live at request time. `time` for the calendar math,
# `time-tz` for DST-correct named-zone resolution.
time = { workspace = true }
time-tz = { workspace = true }
# The hook bridge builds each change's action-hook JSON payload; the page-cache
# envelope + theme contexts derive Serialize/Deserialize.
serde = { workspace = true }
serde_json = { workspace = true }
# Best-effort cache + regen log their swallowed faults (never fail the request /
# tear down the loop).
tracing = { workspace = true }
# The live SiteSettings snapshot is swapped under a short write lock when the
# regen loop sees a Setting change; the read path clones the current Arc.
parking_lot = { workspace = true }
# Parses each on-disk theme's `theme.toml` manifest when the theme registry scans
# the themes dir at boot (mirrors the plugin host's plugin.toml parsing).
toml = { workspace = true }

[dev-dependencies]
# The cache + regen tests drive a REAL embedded store and local-FS blobs (no
# mocks) so read-through / cache-hit / write-through are proven end-to-end.
# Depending on `ferropress-store-embedded` here pulls NO rhypedb edge into
# serve's own manifest — store-embedded is the membrane (the dep-graph lint
# flags only DIRECT `rhypedb-*` deps).
ferropress-store-embedded = { workspace = true }
ferropress-blob-localfs = { workspace = true }
tempfile = { workspace = true }
# Assert the composed RSS/Atom feeds are well-formed XML (parse or fail the test).
roxmltree = { workspace = true }
