# Ferropress CI — quality gates (house style: warnings = errors, fmt from day
# one) plus a dependency-graph lint that enforces the architecture invariants
# (core has no rhypedb/rinch/jkbase; rhypedb lives only in the embedded adapter +
# schema-sdl; exactly one render impl) and a zero-upstream portability leg that
# proves ferropress-core builds with no external upstream at all.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # onnx-dynamic means the build does not download ONNX; tests that actually
      # embed need ORT_DYLIB_PATH set in the runner (deferred until vector tests).
      - run: cargo test --workspace

  dep-graph-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Enforces: core depends on no rhypedb/rinch/jkbase; only
      # ferropress-store-embedded touches rhypedb-engine/-subscribe; only
      # ferropress-store-embedded + ferropress-schema-sdl touch rhypedb-schema;
      # all rhypedb-* deps share one git rev; no rinch dep in any workspace member
      # (rinch is used only by the EXCLUDED ferropress-islands wasm crate).
      - run: cargo run --manifest-path xtask/Cargo.toml -- dep-graph-lint

  no-consumer-names-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Self-enforcing guard: ferropress core is a published, general-purpose CMS — a
      # private consumer project's name (or assertions specific to it) must never leak in.
      # See xtask/src/main.rs's BANNED_CONSUMER_NAMES + CLAUDE.md §4.
      - run: cargo run --manifest-path xtask/Cargo.toml -- no-consumer-names-lint

  # The public-site wasm islands crate (ferropress-islands) is EXCLUDED from the
  # workspace, so the --workspace jobs above never touch it. Lint + build it for
  # wasm32 and run wasm-bindgen so it can't silently rot. The wasm-bindgen CLI
  # version MUST match the crate's `wasm-bindgen` dependency — bump both together.
  islands-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/ferropress-islands
      - run: cargo clippy --manifest-path crates/ferropress-islands/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install wasm-bindgen-cli --version 0.2.125 --locked
      - run: cargo run --manifest-path xtask/Cargo.toml -- build-islands

  # The admin SPA (ferropress-admin) + its BlockTree⇄DocNode bridge
  # (ferropress-editor-bridge) are EXCLUDED from the workspace, so the --workspace
  # jobs above never touch them. Lint the SPA for wasm32, lint + host-test the
  # bridge (its round-trip fidelity tests are the correctness gate for the seam,
  # and only run here since the crate is out of the workspace), then build the
  # wasm bundle. The wasm-bindgen CLI version MUST match the crate's `wasm-bindgen`
  # (bumped from the islands' 0.2.125 by the newer rinch pin) — bump both together.
  admin-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/ferropress-admin
            crates/ferropress-editor-bridge
      - run: cargo clippy --manifest-path crates/ferropress-editor-bridge/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/ferropress-editor-bridge/Cargo.toml
      - run: cargo clippy --manifest-path crates/ferropress-admin/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: cargo run --manifest-path xtask/Cargo.toml -- build-admin

  # Reference WASM plugins (Extism PDK) are EXCLUDED from the workspace, so the
  # --workspace jobs don't cover them. Lint + build them for wasm32, then run the
  # tests that LOAD the built wasm — the extism ABI conformance proofs (the
  # plugin-host integration tests, the ferropress-http full-stack e2e for the
  # custom-block renderer and the comment-moderation filter, and the
  # ferropress-server feed-loop e2e for content:write via the real bridge). These
  # skip in the plain `test` job, where plugins aren't built.
  plugins-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins/callout
            plugins/comment-mod
            plugins/audit-log
            plugins/wiki
            plugins/backlink-index
      - run: cargo clippy --manifest-path plugins/callout/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --manifest-path plugins/comment-mod/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --manifest-path plugins/audit-log/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --manifest-path plugins/wiki/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --manifest-path plugins/backlink-index/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo run --manifest-path xtask/Cargo.toml -- build-plugins
      - run: cargo test -p ferropress-plugin-host
      - run: cargo test -p ferropress-http
      # Full-stack feed-loop e2e: real store + PluginHost + HookBridge + backlink-index
      # wasm (skips if not built — but build-plugins above builds it).
      - run: cargo test -p ferropress-server

  # Portability boundary: ferropress-core must build entirely on its own, naming
  # ZERO external upstream (no rhypedb, no rinch, no jkbase). Building just this
  # package — and nothing else in the workspace — proves the boundary holds.
  zero-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferropress-core
