# Ferropress — virtual workspace manifest.
#
# House style (joeleaver): virtual manifest at the root (no [package]); every
# member lives under crates/<prefix>-<name>; all shared deps are declared ONCE
# here and inherited with `{ workspace = true }`. Edition 2024.
#
# Upstream policy (CLAUDE.md §2): rinch / rhypedb / jkbase are REAL external
# upstreams. They are NEVER depended on via `path = "../…"`. rhypedb is pulled
# by git, pinned to an exact rev so every rhypedb-* crate resolves to the same
# tree (they share version 0.1.0 in one repo — mixing revs is unsupported).
#
# rinch is consumed ONLY by the excluded wasm32 cdylibs — `crates/ferropress-islands`
# (public-site islands) and `crates/ferropress-admin` (the admin SPA), plus the
# excluded host+wasm `crates/ferropress-editor-bridge` (BlockTree ⇄ rinch DocNode
# conversion, which pins `rinch-editor-core` by git rev). None of them are in
# [workspace.dependencies]; they live outside the workspace with their own
# Cargo.lock and never enter the host workspace graph. `ferropress-render-form`
# remains a rinch-free compiling placeholder until its form-renderer slice lands.
#
# Dependency-graph invariant (enforced by xtask + CI): rhypedb appears ONLY on
# ferropress-store-embedded (engine/subscribe) and ferropress-schema-sdl
# (schema only). ferropress-core carries no rhypedb, no rinch, no jkbase.

[workspace]
resolver = "2"
members = ["crates/*"]
# Intentionally OUT of the workspace:
#   * xtask — a CI lint tool; we don't want its (heavier) deps polluting the
#     workspace dependency graph it audits. Invoked via `--manifest-path xtask/`.
#   * crates/ferropress-islands — a wasm32-only `cdylib` depending on rinch-web
#     (browser/web_sys only). The workspace's host `cargo check --workspace`
#     cannot build it, so it lives outside with its OWN Cargo.lock and is built
#     for wasm via `cargo xtask build-islands`.
#   * crates/ferropress-admin — the admin SPA: a wasm32-only `cdylib` depending on
#     rinch-web (browser/web_sys only), same posture as ferropress-islands. Built
#     for wasm via `cargo xtask build-admin`; served at `/_fp/admin`.
#   * crates/ferropress-editor-bridge — the BlockTree ⇄ rinch `DocNode` converter
#     used by the admin SPA. Excluded because it git-deps `rinch-editor-core` (which
#     the dep-graph lint bans from any workspace member); it is wasm-clean AND
#     host-buildable, so its round-trip unit tests run on the host.
#   * plugins/ — reference WASM plugins (Extism PDK, wasm32 `cdylib`s). Built via
#     `cargo xtask build-plugins`; loaded at runtime by ferropress-plugin-host.
exclude = [
    "xtask",
    "crates/ferropress-islands",
    "crates/ferropress-admin",
    "crates/ferropress-editor-bridge",
    #   * crates/ferropress-form-view — the FormSchema → rinch edit-UI renderer used
    #     by the admin SPA. Excluded because it deps the `rinch` facade (banned from
    #     workspace members); a wasm-consumed library path-dep'd by ferropress-admin.
    "crates/ferropress-form-view",
    "plugins",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joeleaver/ferropress"
rust-version = "1.85"

# ---------------------------------------------------------------------------
# Workspace lints. Members opt in with `[lints] workspace = true`. CI gates on
# `-D warnings`, so this is the single place the warning posture is set.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# --- First-party crates (path; listed first per house style) -----------------
ferropress-core            = { path = "crates/ferropress-core" }
ferropress-auth            = { path = "crates/ferropress-auth" }
ferropress-schema-sdl      = { path = "crates/ferropress-schema-sdl" }
ferropress-store-embedded  = { path = "crates/ferropress-store-embedded" }
ferropress-render          = { path = "crates/ferropress-render" }
ferropress-render-form     = { path = "crates/ferropress-render-form" }
ferropress-theme           = { path = "crates/ferropress-theme" }
ferropress-secrets-env     = { path = "crates/ferropress-secrets-env" }
ferropress-blob-localfs    = { path = "crates/ferropress-blob-localfs" }
ferropress-sched-tokiocron = { path = "crates/ferropress-sched-tokiocron" }
ferropress-cert-acme       = { path = "crates/ferropress-cert-acme" }
ferropress-plugin-host     = { path = "crates/ferropress-plugin-host" }
ferropress-serve           = { path = "crates/ferropress-serve" }
ferropress-http            = { path = "crates/ferropress-http" }
# NB: ferropress-islands, ferropress-admin, and ferropress-editor-bridge are NOT
# listed here — they are excluded from the workspace (see [workspace].exclude) and
# declare their deps directly, pinning rinch by git rev.

# --- rhypedb (UPSTREAM, git, pinned rev) -------------------------------------
# ALL rhypedb-* deps MUST share this exact pinned rev (the crates share one repo
# + version 0.1.0; mixing revs is unsupported upstream). The pin is deliberate.
# engine: default-features = false + onnx-dynamic so `cargo build` needs no
# network and ONNX is dlopen'd at runtime (ORT_DYLIB_PATH) — the offline build
# posture. Only ferropress-store-embedded enables engine/subscribe;
# ferropress-schema-sdl uses rhypedb-schema (no ONNX feature surface at all).
rhypedb-schema = { git = "https://github.com/joeleaver/rhypedb.git", rev = "6cbf62b0a2bc3386fc7ad887e6b7ca2d5cb97e03" }
rhypedb-engine = { git = "https://github.com/joeleaver/rhypedb.git", rev = "6cbf62b0a2bc3386fc7ad887e6b7ca2d5cb97e03", default-features = false, features = ["onnx-dynamic"] }
rhypedb-subscribe = { git = "https://github.com/joeleaver/rhypedb.git", rev = "6cbf62b0a2bc3386fc7ad887e6b7ca2d5cb97e03" }

# --- Async runtime -----------------------------------------------------------
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"

# --- HTTP / server stack -----------------------------------------------------
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
# rustls, never native-tls (house invariant). Only used if a crate needs an
# outbound client; kept here so the pick is centralized.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# --- Serialization -----------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# --- WASM plugin runtime -----------------------------------------------------
# The embedded plugin runtime is the `extism` host SDK (it bundles wasmtime,
# ">=27,<31"). It gives us owned limits (with_timeout + with_memory_max),
# deny-by-default host functions + allowed_hosts, and PDK compatibility, behind
# our own `PluginHost` seam. `wasmtime` stays declared in case a crate needs the
# raw engine later, but `ferropress-plugin-host` uses `extism`.
wasmtime = "27"
extism = "1"

# --- Templating / rendering --------------------------------------------------
minijinja = { version = "2", features = ["loader"] }
html-escape = "0.2"
# HTML sanitizer (ferropress-core's `sanitize_widget_html`, the single shared
# cleaner for widget-authored HTML — Custom HTML kind). Re-exports the `url`
# crate's `Url` at its root, so no separate `url` dep is needed for the
# iframe-src https-only scheme check.
ammonia = "4"

# --- Media -------------------------------------------------------------------
# Header-only image sniffing: validates an upload really is a known image and
# reads its intrinsic dimensions WITHOUT a full decode (no pixel buffer). Used by
# the admin media-upload handler so `mime_type`/`width`/`height` come from the
# bytes themselves, never the client's (untrusted) content-type.
imagesize = "0.13"

# --- Scheduler / certs / secrets adapters ------------------------------------
cron = "0.12"
rustls-acme = "0.13"
dotenvy = "0.15"

# --- CLI / logging -----------------------------------------------------------
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Error handling ----------------------------------------------------------
thiserror = "2"
anyhow = "1"

# --- Common utilities --------------------------------------------------------
bytes = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
# Named IANA timezone resolution (site.timezone) with DST, layered on `time`.
# Bundled zone database (default `db` feature) — no reliance on the host's
# /usr/share/zoneinfo, so the self-contained binary stays portable.
time-tz = "2"
parking_lot = "0.12"

# --- Auth / crypto (ferropress-auth) -----------------------------------------
# Argon2id password verification + HMAC-SHA256 stateless session tokens. No cookie
# crate: cookies are built/parsed from raw headers in ferropress-http.
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }

# --- Dev / test --------------------------------------------------------------
tempfile = "3"
# Read-only XML parser used ONLY in tests to assert the syndication feeds are
# well-formed (and to navigate elements) — never a runtime dep.
roxmltree = "0.20"
